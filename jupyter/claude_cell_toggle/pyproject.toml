[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "claude-cell-toggle"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["jupyterlab>=4.0.0,<5"]
license = {text = "MIT"}

[tool.hatch.build.targets.sdist]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel.shared-data]
"claude_cell_toggle/labextension" = "share/jupyter/labextensions/claude-cell-toggle"
"install.json" = "share/jupyter/labextensions/claude-cell-toggle/install.json"
