<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SADataCopilot: Agentic Notebook for Data Analysis</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Modern slate + indigo palette. Chrome stays neutral and quiet so the
     transcript/tool blocks (which keep their original colors) carry the
     visual weight. One accent (indigo) for interactive affordances. */
  :root {
    --bg: #f6f7fb;            /* very soft slate-tinted page */
    --surface: #ffffff;       /* cards / cells */
    --surface-alt: #f1f4f9;   /* toolbars, sidebar */
    --code-bg: #f8fafc;       /* code blocks */
    --output-bg: #ffffff;
    --border: #e2e8f0;        /* slate-200 — softer default border */
    --border-soft: #eef1f6;   /* hairline */
    --text: #0f172a;          /* slate-900 */
    --text-dim: #64748b;      /* slate-500 */
    --text-muted: #94a3b8;    /* slate-400 */
    --accent: #6366f1;        /* indigo-500 — focused cell rail */
    --accent-edit: #4f46e5;   /* indigo-600 — buttons, brand */
    --accent-soft: #eef2ff;   /* indigo-50 — hover bg */
    --prompt: #4f46e5;        /* indigo-600 — In [n]: gutter */
    --markdown: #64748b;      /* slate-500 — md tag */
    --prompt-cell: #7c3aed;   /* violet-600 — prompt-cell tag */
    --green: #059669;         /* emerald-600 */
    --yellow: #d97706;        /* amber-600 */
    --red: #dc2626;           /* red-600 */
    --red-soft: #fef2f2;      /* red-50 */
    --tool-python: #7c3aed;
    --tool-bash:   #d97706;
    --tool-edit:   #2563eb;
    --tool-write:  #059669;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.06);
    --shadow-lg: 0 10px 30px rgba(15, 23, 42, 0.08);
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    font-size: 14px; letter-spacing: -0.005em;
  }
  /* Two-column shell: file sidebar | notebook. The sidebar is a fixed
     column on the left, the notebook keeps its centered max-width feel
     on the right. SessionWidget remains floating top-right. */
  .shell {
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: 100vh;
  }
  .file-sidebar {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    height: 100vh; position: sticky; top: 0;
    font-size: 12px;
  }
  .file-sidebar .sb-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--border-soft);
    font-weight: 600;
  }
  .file-sidebar .sb-header .title {
    color: var(--text); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--text-dim);
  }
  .file-sidebar .sb-header .ws-path {
    font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 10px;
    color: var(--text-muted); display: block; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 400; letter-spacing: 0;
  }
  .file-sidebar .sb-list {
    flex: 1; overflow-y: auto; padding: 8px 0;
  }
  .file-sidebar .sb-empty {
    padding: 12px 16px; color: var(--text-muted); font-style: italic;
  }
  .file-sidebar .sb-item {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 14px; font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', monospace;
    color: var(--text); white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
    border-radius: 4px; margin: 0 6px;
    transition: background 0.12s ease;
  }
  .file-sidebar .sb-item:hover { background: var(--surface-alt); }
  .file-sidebar .sb-item.dir { color: var(--accent-edit); font-weight: 500; }
  .file-sidebar .sb-item .size {
    margin-left: auto; color: var(--text-muted); font-size: 10px;
  }
  .file-sidebar .sb-refresh {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; padding: 4px 8px; font-size: 11px; color: var(--text-dim);
    transition: all 0.12s ease;
  }
  .file-sidebar .sb-refresh:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-edit); }
  .file-sidebar .sb-refresh:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Right padding leaves room for the floating SessionWidget so its
     ~220px box never overlaps cell content at narrow viewports. */
  .app { width: 100%; max-width: 1400px; margin: 0 auto; padding: 24px 280px 80px 36px; }

  .header {
    display: flex; align-items: center; gap: 14px;
    padding: 18px 24px; background: var(--surface);
    border: 1px solid var(--border-soft); border-radius: var(--radius-md);
    margin-bottom: 20px; box-shadow: var(--shadow-sm);
  }
  .header .brand {
    font-size: 17px; font-weight: 700; color: var(--text);
    letter-spacing: -0.02em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .header .brand::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--prompt-cell));
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .header .divider {
    width: 1px; height: 18px; align-self: center; background: var(--border);
  }
  .header .tagline {
    font-size: 13px; font-weight: 400; color: var(--text-dim);
    letter-spacing: 0;
  }
  .header-actions { display: flex; gap: 6px; align-items: center; margin-left: auto; }

  .btn {
    padding: 6px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-family: inherit;
    font-size: 12px; font-weight: 500; cursor: pointer;
    transition: all 0.12s ease;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: var(--surface-alt); border-color: var(--text-muted); }
  .btn:active { transform: translateY(0.5px); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: var(--red-soft); }
  .btn-primary {
    background: var(--accent-edit); border-color: var(--accent-edit); color: #fff;
    box-shadow: 0 1px 2px rgba(79, 70, 229, 0.2);
  }
  .btn-primary:hover { background: #4338ca; border-color: #4338ca; box-shadow: 0 2px 6px rgba(79, 70, 229, 0.25); }
  .btn-sm { padding: 3px 8px; font-size: 11px; }
  .file-input { display: none; }

  .cells { display: flex; flex-direction: column; gap: 0; }

  /* Cell — Jupyter "In/Out" structure with a left "prompt" gutter */
  .cell {
    display: grid;
    grid-template-columns: 80px 1fr;
    border: 1px solid var(--border-soft);
    border-radius: var(--radius-md);
    background: var(--surface);
    margin-bottom: 8px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .cell:hover { border-color: var(--border); }
  .cell.focused {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-sm);
  }
  .cell.excluded { opacity: 0.55; }
  .cell.excluded .cell-prompt { color: var(--text-dim); }

  .cell-prompt {
    grid-row: 1 / span 3;
    padding: 10px 10px 0 10px;
    font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', 'DejaVu Sans Mono', monospace;
    font-size: 11px;
    color: var(--prompt);
    text-align: right;
    user-select: none;
    line-height: 1.5;
    background: var(--surface-alt);
    border-right: 1px solid var(--border-soft);
  }
  .cell.kind-markdown .cell-prompt { color: var(--markdown); }
  .cell.kind-prompt .cell-prompt { color: var(--prompt-cell); }
  .cell-prompt-label { display: block; }
  .cell-prompt-duration {
    display: block; margin-top: 2px;
    font-size: 10px; color: var(--text-muted); font-weight: 500;
  }
  .cell-prompt-actions {
    margin-top: 4px;
    display: flex; gap: 2px; flex-wrap: wrap; justify-content: flex-end;
  }

  .cell-body { display: flex; flex-direction: column; min-width: 0; }

  .cell-toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; font-size: 11px; color: var(--text-dim);
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border-soft);
  }
  .cell-kind-tag {
    padding: 2px 8px; border-radius: 999px; font-weight: 600;
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em;
    background: currentColor;
  }
  .cell-kind-tag { position: relative; color: var(--prompt); }
  .cell-kind-tag::before {
    content: attr(data-label); position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  /* Simpler approach: use bg + light text. */
  .cell-kind-tag { background: transparent; color: var(--prompt); border: 1px solid currentColor; }
  .cell-kind-tag::before { display: none; }
  .cell.kind-python .cell-kind-tag { color: var(--prompt); background: var(--accent-soft); border-color: transparent; }
  .cell.kind-markdown .cell-kind-tag { color: var(--markdown); background: var(--surface); border-color: var(--border); }
  .cell.kind-prompt .cell-kind-tag { color: var(--prompt-cell); background: #f5f3ff; border-color: transparent; }
  .cell-toolbar .spacer { flex: 1; }
  .icon-btn {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    font-size: 11px; padding: 3px 8px; border-radius: 4px;
    transition: all 0.12s ease;
  }
  .icon-btn:hover { background: var(--surface); color: var(--text); }
  .icon-btn.active { color: var(--accent-edit); background: var(--accent-soft); }
  .run-btn-cell {
    background: var(--accent-edit); color: #fff;
    border: 1px solid var(--accent-edit);
    padding: 4px 12px; border-radius: var(--radius-sm);
    font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit;
    transition: all 0.12s ease;
    box-shadow: 0 1px 2px rgba(79, 70, 229, 0.2);
  }
  .run-btn-cell:hover { background: #4338ca; border-color: #4338ca; box-shadow: 0 2px 6px rgba(79, 70, 229, 0.3); }
  .run-btn-cell.cancel { color: #fff; background: var(--red); border-color: var(--red); box-shadow: 0 1px 2px rgba(220, 38, 38, 0.2); }
  .run-btn-cell.cancel:hover { background: #b91c1c; border-color: #b91c1c; }
  .model-select {
    font-family: inherit; font-size: 11px; padding: 3px 8px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--text); cursor: pointer;
    transition: border-color 0.12s ease;
  }
  .model-select:hover { border-color: var(--text-muted); }
  .model-select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .model-tag {
    font-family: inherit; font-size: 11px; padding: 3px 8px;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text-muted);
  }

  /* Cell input area (the "In[]" box) */
  .cell-source {
    background: var(--code-bg);
    border-bottom: 1px solid var(--border-soft);
  }
  .cell-source:last-child { border-bottom: none; }
  .cell-source textarea {
    width: 100%; min-height: 36px; padding: 10px 14px;
    background: transparent; border: none; color: var(--text);
    font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', 'DejaVu Sans Mono', monospace;
    font-size: 13px; line-height: 1.6;
    resize: vertical; outline: none; display: block;
    tab-size: 4;
  }
  .cell-source textarea::placeholder { color: var(--text-muted); }
  .cell-source.markdown { background: var(--code-bg); }
  .cell-source.markdown textarea { font-family: inherit; }
  .cell-source.prompt { background: var(--code-bg); }
  .cell-source.prompt textarea { font-family: inherit; }

  /* Output area (the "Out[]" box) */
  .cell-output {
    background: var(--output-bg);
    border-top: 1px solid var(--border-soft);
    padding: 10px 14px; font-size: 12px;
    max-height: 600px; overflow-y: auto;
    font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Consolas', 'DejaVu Sans Mono', monospace;
  }
  .cell-output pre {
    background: transparent; border: none; padding: 0;
    font-size: 12px; line-height: 1.4;
    white-space: pre-wrap; word-break: break-word;
    color: var(--text); margin: 0;
    font-family: inherit;
  }
  .stdout { color: var(--text); }
  .stderr { color: var(--red); background: var(--red-soft); padding: 4px 6px; border-radius: 2px; }

  /* Markdown rendered output (matches Jupyter's normal text) */
  .md-render {
    line-height: 1.6; font-size: 14px;
    padding: 8px 12px; color: var(--text);
  }
  .md-render p { margin: 6px 0; }
  .md-render h1 { font-size: 22px; font-weight: 600; margin: 14px 0 8px; color: var(--text); border-bottom: 1px solid var(--border-soft); padding-bottom: 4px; }
  .md-render h2 { font-size: 18px; font-weight: 600; margin: 12px 0 6px; color: var(--text); }
  .md-render h3 { font-size: 15px; font-weight: 600; margin: 10px 0 4px; color: var(--text); }
  .md-render code {
    background: var(--surface-alt); padding: 1px 4px; border-radius: 2px;
    font-family: 'Menlo', 'Consolas', monospace; font-size: 90%;
    color: #be185d;
  }
  .md-render pre {
    background: var(--code-bg); border: 1px solid var(--border-soft);
    padding: 8px 10px; border-radius: 2px; overflow-x: auto;
    font-family: 'Menlo', 'Consolas', monospace; font-size: 12px;
  }
  .md-render pre code { background: none; padding: 0; color: var(--text); }
  .md-render ul, .md-render ol { padding-left: 24px; margin: 6px 0; }
  .md-render strong { color: var(--text); }
  .md-render table { border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  .md-render th, .md-render td { border: 1px solid var(--border); padding: 4px 10px; }
  .md-render th { background: var(--surface-alt); font-weight: 600; }
  .md-render blockquote {
    border-left: 4px solid var(--border-soft); padding-left: 10px;
    color: var(--text-dim); margin: 8px 0;
  }

  /* Transcript blocks (assistant text + tool calls + tool results) */
  .transcript {
    background: var(--output-bg); padding: 4px 0;
    max-height: 600px; overflow-y: auto;
  }
  .assistant-block {
    margin: 6px 8px; padding: 10px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px; line-height: 1.6;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .assistant-block p { margin: 4px 0; }
  .assistant-block code { background: var(--surface-alt); padding: 1px 5px; border-radius: 3px; font-family: 'Menlo', monospace; font-size: 12px; color: #be185d; }
  .assistant-block pre { background: var(--code-bg); border: 1px solid var(--border-soft); padding: 8px 10px; border-radius: 4px; margin: 6px 0; font-size: 12px; overflow-x: auto; font-family: 'Menlo', monospace; }
  .tool-block {
    margin: 6px 0 6px 8px; padding-left: 10px;
    border-left: 3px solid var(--tool-python);
  }
  .tool-block.bash { border-color: var(--tool-bash); }
  .tool-block.edit { border-color: var(--tool-edit); }
  .tool-block.write { border-color: var(--tool-write); }
  .tool-block.python { border-color: var(--tool-python); }
  .tool-block-tag {
    font-family: 'Menlo', 'Consolas', monospace;
    font-size: 11px; font-weight: 600;
    color: var(--tool-python); margin-bottom: 3px;
  }
  .tool-block.bash .tool-block-tag { color: var(--tool-bash); }
  .tool-block.edit .tool-block-tag { color: var(--tool-edit); }
  .tool-block.write .tool-block-tag { color: var(--tool-write); }
  .tool-block-body {
    background: var(--code-bg); color: var(--text);
    border: 1px solid var(--border-soft);
    padding: 6px 8px; border-radius: 2px;
    font-family: 'Menlo', 'Consolas', monospace;
    font-size: 12px; white-space: pre-wrap;
    word-break: break-word; overflow-x: auto;
  }
  .tool-result {
    margin: 2px 0 8px 24px; padding-left: 8px;
    border-left: 2px dashed var(--border);
    font-size: 12px;
  }
  .tool-result-tag { color: var(--text-dim); margin-bottom: 3px; font-size: 11px; font-family: 'Menlo', monospace; }
  .tool-result-body {
    background: var(--surface-alt); padding: 6px 8px; border-radius: 2px;
    color: var(--text); white-space: pre-wrap; word-break: break-word;
    font-family: 'Menlo', monospace; font-size: 12px;
    border: 1px solid var(--border-soft);
  }

  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-dim); }
  .empty-state h2 { color: var(--text); margin-bottom: 10px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .empty-state p { margin-bottom: 16px; font-size: 13px; }

  .add-cell-bar {
    display: flex; gap: 6px; justify-content: center;
    padding: 6px; margin: 2px 0;
    opacity: 0.4; transition: opacity 0.15s ease;
  }
  .add-cell-bar:hover { opacity: 1; }
  .add-cell-bar .btn { font-size: 11px; padding: 4px 10px; border-radius: var(--radius-sm); }

  /* Floating session widget (top-right) */
  .session-widget {
    position: fixed; top: 20px; right: 20px;
    background: var(--surface); border: 1px solid var(--border-soft);
    border-radius: var(--radius-md); box-shadow: var(--shadow-lg);
    padding: 14px 16px; min-width: 220px; z-index: 50;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 11px; color: var(--text);
    backdrop-filter: blur(8px);
  }
  .session-widget .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 10px;
  }
  .session-widget .row:last-child { margin-bottom: 0; }
  .session-widget .label {
    color: var(--text-muted); font-size: 10px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .session-widget .val {
    color: var(--text); font-weight: 600;
    font-family: 'JetBrains Mono', 'SF Mono', 'Menlo', monospace;
    font-size: 11px;
  }
  .session-widget .ctx-bar {
    height: 5px; background: var(--surface-alt); border-radius: 999px;
    overflow: hidden; margin-top: 4px;
  }
  .session-widget .ctx-bar-fill {
    height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-edit));
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  .session-widget .ctx-bar-fill.warn { background: var(--yellow); }
  .session-widget .ctx-bar-fill.danger { background: var(--red); }
  .session-widget .ctx-row { flex-direction: column; align-items: stretch; gap: 2px; }
  .session-widget .ctx-top {
    display: flex; align-items: center; justify-content: space-between;
  }
  .session-widget .excluded { color: var(--text-dim); margin-left: 4px; }
  .session-widget .cost { color: var(--green); }

  /* Modals */
  .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal { background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-lg); padding: 22px; max-width: 600px; width: 90%; box-shadow: var(--shadow-lg); }
  .modal h3 { margin-bottom: 10px; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .modal p { color: var(--text-dim); margin-bottom: 14px; font-size: 13px; line-height: 1.5; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  .session-list { display: flex; flex-direction: column; gap: 4px; max-height: 400px; overflow-y: auto; }
  .session-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; background: var(--surface);
    border: 1px solid var(--border-soft); border-radius: var(--radius-sm); cursor: pointer;
    transition: all 0.12s ease;
  }
  .session-item:hover { border-color: var(--accent); background: var(--accent-soft); }

  .error-bar {
    padding: 10px 16px; background: var(--red-soft);
    border: 1px solid #fecaca; border-radius: var(--radius-sm); margin-bottom: 12px;
    font-size: 12px; color: var(--red); display: flex; align-items: center; justify-content: space-between;
    box-shadow: var(--shadow-sm);
  }
  .error-bar button { background: none; border: none; color: var(--red); cursor: pointer; font-size: 16px; padding: 0 4px; line-height: 1; }
  .error-bar button:hover { opacity: 0.7; }

  /* Custom scrollbars (subtle, modern) */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* Spinner */
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  .pulse { animation: pulse 1.4s ease-in-out infinite; color: var(--text-dim); font-style: italic; font-size: 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useCallback, useMemo, useRef, useEffect } = React;

// Same-origin: when served from the container, the page is loaded over
// HTTPS with Basic auth and the browser will replay credentials on every
// fetch automatically. Localhost dev still works because server.py serves
// notebook.html itself on :8787.
const API = '';

// -------------------------- helpers --------------------------

function uuid4() {
  return crypto.randomUUID ? crypto.randomUUID()
    : ('xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      }));
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
  return res.json();
}

// USD per token. Cached input is the OpenAI "cached_input" rate (~10% of
// regular input for gpt-5 family). Update when prices change.
const MODEL_PRICING = {
  'gpt-5.5':       { input: 5.00 / 1e6, cachedInput: 0.500 / 1e6, output: 30.00 / 1e6 },
  'gpt-5':         { input: 1.25 / 1e6, cachedInput: 0.125 / 1e6, output: 10.00 / 1e6 },
  'gpt-5-mini':    { input: 0.25 / 1e6, cachedInput: 0.025 / 1e6, output:  2.00 / 1e6 },
  'gpt-5-nano':    { input: 0.05 / 1e6, cachedInput: 0.005 / 1e6, output:  0.40 / 1e6 },
};
const DEFAULT_PRICING = MODEL_PRICING['gpt-5.5'];

function computeCost(model, usage) {
  if (!usage) return 0;
  const p = MODEL_PRICING[model] || DEFAULT_PRICING;
  const cached = usage.cache_read_input_tokens || 0;
  const freshInput = (usage.input_tokens || 0) + (usage.cache_creation_input_tokens || 0);
  const output = usage.output_tokens || 0;
  return freshInput * p.input + cached * p.cachedInput + output * p.output;
}

function parseSessionJSONL(text) {
  if (!text || !text.trim()) return [];
  return text.trim().split('\n').filter(Boolean).map(line => {
    try { return JSON.parse(line); } catch { return null; }
  }).filter(Boolean);
}

function renderMarkdown(text) {
  if (!text) return '';
  try { return marked.parse(text, { breaks: true }); } catch { return text; }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatTokens(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function stringifyContent(c) {
  return typeof c === 'string' ? c : JSON.stringify(c, null, 2);
}

function extractTextContent(content) {
  if (typeof content === 'string') return content;
  if (Array.isArray(content)) {
    const parts = [];
    for (const item of content) {
      if (item && typeof item === 'object' && item.type === 'text' && typeof item.text === 'string') {
        parts.push(item.text);
      }
    }
    if (parts.length) return parts.join('\n');
  }
  return stringifyContent(content);
}

// Stream POST + parse SSE manually (fetch is fine; EventSource doesn't support POST).
// `aborter` is created by the caller so it can wire it into `running[cellId]`
// *before* the await — otherwise the Stop button has no controller to abort
// with until the stream is already done.
async function streamRun(body, onEvent, onEnd, onError, aborter) {
  try {
    const res = await fetch(API + '/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
      signal: aborter.signal,
    });
    if (!res.ok || !res.body) {
      onError(new Error('HTTP ' + res.status));
      return aborter;
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      // Parse SSE blocks
      let idx;
      while ((idx = buffer.indexOf('\n\n')) !== -1) {
        const block = buffer.slice(0, idx);
        buffer = buffer.slice(idx + 2);
        let event = 'message';
        const dataLines = [];
        for (const line of block.split('\n')) {
          if (line.startsWith('event: ')) event = line.slice(7).trim();
          else if (line.startsWith('data: ')) dataLines.push(line.slice(6));
        }
        if (!dataLines.length) continue;
        try {
          const data = JSON.parse(dataLines.join('\n'));
          if (event === 'end') onEnd(data);
          else if (event === 'error') onError(new Error(data.message || 'unknown'));
          else onEvent(event, data);
        } catch { /* skip malformed */ }
      }
    }
  } catch (err) {
    if (err.name !== 'AbortError') onError(err);
  }
}

// -------------------------- transcript building --------------------------

const HIDDEN_TOOLS = new Set(['ToolSearch']);
const KERNEL_TOOL = 'python_run';
const CODE_TOOLS = new Set(['Bash', 'Edit', 'Write']);

// Reduce sidecar events into ordered transcript blocks.
// The sidecar already shapes events into {kind: assistant_text|tool_use|tool_result}.
function reduceTranscript(blocks, event, data, toolNameById) {
  if (event !== 'event') return blocks;
  const ev = data.event || data;  // tolerate either wrapper
  const k = ev.kind;
  if (k === 'assistant_text' && typeof ev.text === 'string') {
    const last = blocks[blocks.length - 1];
    if (last && last.kind === 'text') last.text += ev.text;
    else blocks.push({ kind: 'text', text: ev.text });
  } else if (k === 'tool_use') {
    const name = ev.name || 'unknown';
    const id = ev.id || '';
    if (id) toolNameById.set(id, name);
    if (HIDDEN_TOOLS.has(name)) return blocks;
    blocks.push({ kind: 'tool_use', id, name, input: ev.input });
  } else if (k === 'tool_result') {
    const id = ev.id || '';
    const calledName = ev.name || (id ? (toolNameById.get(id) || '') : '');
    if (HIDDEN_TOOLS.has(calledName)) return blocks;
    blocks.push({ kind: 'tool_result', id, name: calledName, text: ev.text || '' });
  }
  return blocks;
}

function TranscriptView({ blocks }) {
  return (
    <div className="transcript">
      {blocks.map((b, i) => {
        if (b.kind === 'text') {
          return (
            <div key={i} className="assistant-block md-render"
                 dangerouslySetInnerHTML={{ __html: renderMarkdown(b.text) }} />
          );
        }
        if (b.kind === 'tool_use') {
          if (b.name === KERNEL_TOOL) {
            const code = b.input && typeof b.input.code === 'string' ? b.input.code : stringifyContent(b.input);
            return (
              <div key={i} className="tool-block python">
                <div className="tool-block-tag">&gt;&gt;&gt; python (kernel)</div>
                <div className="tool-block-body">{code}</div>
              </div>
            );
          }
          if (CODE_TOOLS.has(b.name)) {
            const cls = b.name.toLowerCase();
            const tag = b.name === 'Bash' ? '$ bash' : b.name === 'Edit' ? '✎ edit' : '+ write';
            const src = b.name === 'Bash' ? (b.input?.command || '')
                      : b.name === 'Write' ? `# Write: ${b.input?.file_path || ''}\n${b.input?.content || ''}`
                      : (b.input?.old_string ? `# Edit: ${b.input.file_path || ''}\n# old:\n${b.input.old_string}\n# new:\n${b.input.new_string || ''}`
                                              : stringifyContent(b.input));
            return (
              <div key={i} className={`tool-block ${cls}`}>
                <div className="tool-block-tag">{tag}</div>
                <div className="tool-block-body">{String(src)}</div>
              </div>
            );
          }
          return (
            <div key={i} className="tool-block">
              <div className="tool-block-tag">{b.name}</div>
              <div className="tool-block-body">{stringifyContent(b.input)}</div>
            </div>
          );
        }
        if (b.kind === 'tool_result') {
          const trunc = b.text && b.text.length > 4000 ? b.text.slice(0, 4000) + '\n... (truncated)' : b.text;
          return (
            <div key={i} className="tool-result">
              <div className="tool-result-tag">↳ result</div>
              <div className="tool-result-body">{trunc}</div>
            </div>
          );
        }
        return null;
      })}
    </div>
  );
}

// -------------------------- cell components --------------------------

function CellToolbar({ cell, running, onRun, onCancel, onToggleInclude, onChangeModel }) {
  return (
    <div className="cell-toolbar">
      <span className="cell-kind-tag">{cell.kind}</span>
      {cell.kind === 'prompt' && <span className="model-tag">gpt-5.5</span>}
      {(cell.kind === 'python' || cell.kind === 'prompt') && (
        <button className={`icon-btn ${cell.included !== false ? 'active' : ''}`} title="Include in next prompt's context"
                onClick={onToggleInclude}>{cell.included !== false ? '◉ included' : '○ excluded'}</button>
      )}
      <span className="spacer" />
      {cell.kind !== 'markdown' && (
        running
          ? <button className="run-btn-cell cancel" onClick={onCancel}>■ Stop</button>
          : <button className="run-btn-cell" onClick={onRun}>▶ Run</button>
      )}
    </div>
  );
}

function PromptGutter({ kind, runNumber, running, duration, onMoveUp, onMoveDown, onDelete }) {
  let label;
  if (kind === 'python') label = `In [${runNumber || ' '}]:`;
  else if (kind === 'prompt') label = running ? 'In [*]:' : `In [${runNumber || ' '}]:`;
  else label = '';
  return (
    <div className="cell-prompt">
      <span className="cell-prompt-label">{label}</span>
      {duration ? (
        <span className="cell-prompt-duration" title="Run duration">
          {(duration / 1000).toFixed(1)}s
        </span>
      ) : null}
      <div className="cell-prompt-actions">
        <button className="icon-btn" title="Move up" onClick={onMoveUp}>↑</button>
        <button className="icon-btn" title="Move down" onClick={onMoveDown}>↓</button>
        <button className="icon-btn" title="Delete cell" onClick={onDelete}>×</button>
      </div>
    </div>
  );
}

function PythonCell({ cell, running, onRun, onCancel, onChange, onMoveUp, onMoveDown, onDelete, ...rest }) {
  const taRef = useRef(null);
  const auto = () => {
    const el = taRef.current; if (!el) return;
    el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 400) + 'px';
  };
  useEffect(auto, [cell.source]);
  return (
    <div className={`cell kind-python ${cell.included === false ? 'excluded' : ''}`}>
      <PromptGutter kind="python" runNumber={cell.runNumber} running={running} onMoveUp={onMoveUp} onMoveDown={onMoveDown} onDelete={onDelete} />
      <div className="cell-body">
        <CellToolbar cell={cell} running={running} onRun={onRun} onCancel={onCancel} {...rest} />
        <div className="cell-source python">
          <textarea ref={taRef} value={cell.source}
                    onChange={(e) => { onChange({ source: e.target.value }); auto(); }}
                    onKeyDown={(e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); onRun(); } }}
                    placeholder="# Python code (Shift+Enter or Cmd+Enter to run)" spellCheck={false} />
        </div>
        {(cell.output || cell.outputErr) && (
          <div className="cell-output">
            {cell.output && <pre className="stdout">{cell.output}</pre>}
            {cell.outputErr && <pre className="stderr">{cell.outputErr}</pre>}
          </div>
        )}
      </div>
    </div>
  );
}

function MarkdownCell({ cell, onChange, onMoveUp, onMoveDown, onDelete, ...rest }) {
  const [editing, setEditing] = useState(!cell.source);
  const taRef = useRef(null);
  useEffect(() => {
    const el = taRef.current; if (!el) return;
    el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 400) + 'px';
  }, [cell.source, editing]);
  return (
    <div className={`cell kind-markdown ${editing ? 'focused' : ''}`}>
      <PromptGutter kind="markdown" onMoveUp={onMoveUp} onMoveDown={onMoveDown} onDelete={onDelete} />
      <div className="cell-body">
        <CellToolbar cell={cell} {...rest} onRun={() => setEditing(false)} onCancel={() => {}} running={false} />
        {editing ? (
          <div className="cell-source markdown">
            <textarea ref={taRef} value={cell.source}
                      onChange={(e) => onChange({ source: e.target.value })}
                      onKeyDown={(e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); setEditing(false); } }}
                      placeholder="Markdown — Cmd+Enter to render" spellCheck={false} />
          </div>
        ) : (
          <div className="md-render" onDoubleClick={() => setEditing(true)}
               dangerouslySetInnerHTML={{ __html: renderMarkdown(cell.source || '*(empty markdown — double-click to edit)*') }} />
        )}
      </div>
    </div>
  );
}

function PromptCell({ cell, running, onRun, onCancel, onChange, onMoveUp, onMoveDown, onDelete, ...rest }) {
  const taRef = useRef(null);
  const auto = () => {
    const el = taRef.current; if (!el) return;
    el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 300) + 'px';
  };
  useEffect(auto, [cell.source]);
  return (
    <div className={`cell kind-prompt ${cell.included === false ? 'excluded' : ''}`}>
      <PromptGutter kind="prompt" runNumber={cell.runNumber} running={running} duration={cell.duration} onMoveUp={onMoveUp} onMoveDown={onMoveDown} onDelete={onDelete} />
      <div className="cell-body">
        <CellToolbar cell={cell} running={running} onRun={onRun} onCancel={onCancel} {...rest} />
        <div className="cell-source prompt">
          <textarea ref={taRef} value={cell.source}
                    onChange={(e) => { onChange({ source: e.target.value }); auto(); }}
                    onKeyDown={(e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); onRun(); } }}
                    placeholder="Ask Copilot... (Cmd+Enter)" spellCheck={false} />
        </div>
        {(cell.transcript && cell.transcript.length > 0) && (
          <div className="cell-output">
            <TranscriptView blocks={cell.transcript} />
          </div>
        )}
        {running && (!cell.transcript || cell.transcript.length === 0) && (
          <div className="cell-output"><span className="pulse">copilot is thinking…</span></div>
        )}
      </div>
    </div>
  );
}

function AddCellBar({ onAdd }) {
  return (
    <div className="add-cell-bar">
      <button className="btn" onClick={() => onAdd('python')}>+ Python</button>
      <button className="btn" onClick={() => onAdd('markdown')}>+ Markdown</button>
      <button className="btn" onClick={() => onAdd('prompt')}>+ Prompt</button>
    </div>
  );
}

// -------------------------- App --------------------------

function newCell(kind) {
  const base = { id: uuid4(), kind, source: '', included: true };
  if (kind === 'python') return { ...base, output: '', outputErr: '' };
  if (kind === 'markdown') return { ...base };
  if (kind === 'prompt') return { ...base, model: 'gpt-5.5', transcript: [], usage: null, duration: 0, cost: 0 };
  return base;
}

function App() {
  const [cells, setCells] = useState(() => [newCell('prompt')]);
  // Browser is single-session: no persistence, no session library, no
  // on-disk resume. Each prompt run rebuilds a synthetic session from the
  // currently-included priors (mirrors vscode behavior).
  const contextLimit = 200000;
  const [totalCost, setTotalCost] = useState(0);
  const [lastInputTokens, setLastInputTokens] = useState(0);
  const [error, setError] = useState('');
  const [running, setRunning] = useState({});  // cellId -> AbortController
  const kernelIdRef = useRef(uuid4());
  const runCounterRef = useRef(0);

  // Keepalive ping. Server reaps kernels that haven't been pinged in
  // ~90s, so a refreshed/closed tab's old kernel gets disposed instead
  // of leaking. Send one immediately and then every 30s.
  useEffect(() => {
    let cancelled = false;
    const ping = () => {
      if (cancelled) return;
      fetch(API + '/api/keepalive', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ kernelId: kernelIdRef.current }),
      }).catch(() => { /* ignore — server might be restarting */ });
    };
    ping();
    const id = setInterval(ping, 30000);
    return () => { cancelled = true; clearInterval(id); };
  }, []);

  const updateCell = useCallback((id, patch) => {
    setCells((prev) => prev.map((c) => c.id === id ? { ...c, ...patch } : c));
  }, []);

  const moveCell = useCallback((id, dir) => {
    setCells((prev) => {
      const i = prev.findIndex((c) => c.id === id); if (i < 0) return prev;
      const j = i + dir; if (j < 0 || j >= prev.length) return prev;
      const next = [...prev]; [next[i], next[j]] = [next[j], next[i]]; return next;
    });
  }, []);

  const insertCell = useCallback((afterId, kind) => {
    setCells((prev) => {
      const i = afterId ? prev.findIndex((c) => c.id === afterId) : prev.length - 1;
      const next = [...prev]; next.splice(i + 1, 0, newCell(kind)); return next;
    });
  }, []);

  const removeCell = useCallback((id) => {
    setCells((prev) => prev.length > 1 ? prev.filter((c) => c.id !== id) : prev);
  }, []);

  // ----- python cell run -----
  const runPython = useCallback(async (cell) => {
    if (!cell.source.trim()) return;
    updateCell(cell.id, { output: '', outputErr: '(running...)' });
    try {
      const data = await api('/api/python/exec', {
        method: 'POST',
        body: JSON.stringify({ kernelId: kernelIdRef.current, code: cell.source }),
      });
      if (data.error) {
        updateCell(cell.id, { output: '', outputErr: data.error });
        return;
      }
      runCounterRef.current += 1;
      updateCell(cell.id, {
        output: data.ok ? data.output : '',
        outputErr: data.ok ? '' : data.output,
        runNumber: runCounterRef.current,
      });
    } catch (e) {
      updateCell(cell.id, { output: '', outputErr: 'Server error: ' + e.message });
    }
  }, [updateCell]);

  // ----- prompt cell run -----
  const runPrompt = useCallback(async (cell) => {
    if (!cell.source.trim()) return;
    if (running[cell.id]) return;

    // Build priorRuns from cells above this one, mirroring the vscode
    // CopilotBackend: each entry carries the source/output (python) or
    // the captured `history` blob (prompt). The sidecar replays these
    // into a synthetic session before the new prompt.
    const idx = cells.findIndex((c) => c.id === cell.id);
    const priorRuns = [];
    for (let i = 0; i < idx; i++) {
      const c = cells[i];
      if (c.kind === 'python' && c.source) {
        priorRuns.push({
          kind: 'python',
          included: c.included !== false,
          source: c.source,
          output: c.output || c.outputErr || '',
        });
      } else if (c.kind === 'prompt' && c.history) {
        priorRuns.push({
          kind: 'prompt',
          included: c.included !== false,
          history: c.history,
        });
      }
    }

    runCounterRef.current += 1;
    updateCell(cell.id, { transcript: [], usage: null, duration: 0, cost: 0, runNumber: runCounterRef.current });

    const blocks = [];
    const toolNameById = new Map();
    const isExcluded = cell.included === false;

    const onEvent = (eventName, data) => {
      reduceTranscript(blocks, eventName, data, toolNameById);
      updateCell(cell.id, { transcript: [...blocks] });
    };

    const onEnd = (data) => {
      const r = (data && data.result) || {};
      const usage = r.usage || {};
      const totalContext =
        (usage.input_tokens || 0)
        + (usage.cache_creation_input_tokens || 0)
        + (usage.cache_read_input_tokens || 0)
        + (usage.output_tokens || 0);
      if (!isExcluded && totalContext) setLastInputTokens(totalContext);
      // BYOK SDK reports cost: 0 — compute it client-side from the usage
      // counters and the model's published per-token pricing.
      const sdkCost = Number(r.cost || 0);
      const turnCost = sdkCost > 0 ? sdkCost : computeCost(cell.model, usage);
      if (turnCost && !isExcluded) setTotalCost((p) => p + turnCost);
      updateCell(cell.id, {
        transcript: [...blocks],
        usage: r.usage || null,
        duration: r.duration_ms || 0,
        cost: turnCost,
        history: r.history || null,
      });
      setRunning((p) => { const n = { ...p }; delete n[cell.id]; return n; });
    };

    const onError = (err) => {
      setError('Run failed: ' + err.message);
      setRunning((p) => { const n = { ...p }; delete n[cell.id]; return n; });
    };

    const aborter = new AbortController();
    setRunning((p) => ({ ...p, [cell.id]: aborter }));
    await streamRun({
      prompt: cell.source,
      kernelId: kernelIdRef.current,
      model: 'gpt-5.5',
      isExcluded,
      priorRuns,
    }, onEvent, onEnd, onError, aborter);
  }, [cells, running, updateCell]);

  const cancelRun = useCallback((cellId) => {
    const a = running[cellId];
    if (a && a.abort) a.abort();
    setRunning((p) => { const n = { ...p }; delete n[cellId]; return n; });
  }, [running]);

  const ctxPct = Math.min(100, Math.round((lastInputTokens / contextLimit) * 100));

  return (
    <div className="shell">
      <FileSidebar kernelId={kernelIdRef.current} running={running} />
      <div className="app">
      <div className="header">
        <span className="brand">SADataCopilot</span>
        <span className="divider"></span>
        <span className="tagline">Agentic Notebook for Data Analysis</span>
      </div>

      {error && (
        <div className="error-bar">
          <span>{error}</span>
          <button onClick={() => setError('')}>×</button>
        </div>
      )}

      <div className="cells">
        {cells.map((cell, i) => {
          const handlers = {
            onChange: (patch) => updateCell(cell.id, patch),
            onChangeKind: (kind) => updateCell(cell.id, { kind }),
            onChangeModel: (model) => updateCell(cell.id, { model }),
            onToggleInclude: () => updateCell(cell.id, { included: cell.included === false }),
            onDelete: () => removeCell(cell.id),
            onMoveUp: () => moveCell(cell.id, -1),
            onMoveDown: () => moveCell(cell.id, +1),
          };
          const isRunning = !!running[cell.id];
          const onCancel = () => cancelRun(cell.id);
          let view;
          if (cell.kind === 'python') {
            view = <PythonCell cell={cell} running={isRunning} onRun={() => runPython(cell)} onCancel={onCancel} {...handlers} />;
          } else if (cell.kind === 'markdown') {
            view = <MarkdownCell cell={cell} running={false} onRun={() => {}} onCancel={() => {}} {...handlers} />;
          } else {
            view = <PromptCell cell={cell} running={isRunning} onRun={() => runPrompt(cell)} onCancel={onCancel} {...handlers} />;
          }
          return (
            <React.Fragment key={cell.id}>
              {view}
              <AddCellBar onAdd={(kind) => insertCell(cell.id, kind)} />
            </React.Fragment>
          );
        })}
        {cells.length === 0 && (
          <div className="empty-state">
            <h2>Empty notebook</h2>
            <AddCellBar onAdd={(kind) => insertCell(null, kind)} />
          </div>
        )}
      </div>

      <SessionWidget
        ctxPct={ctxPct}
        lastInputTokens={lastInputTokens}
        contextLimit={contextLimit}
        totalCost={totalCost}
        cells={cells}
      />
      </div>
    </div>
  );
}

function FileSidebar({ kernelId, running }) {
  const [files, setFiles] = useState([]);
  const [workspace, setWorkspace] = useState('');
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState('');

  const refresh = useCallback(async () => {
    if (!kernelId) return;
    setLoading(true);
    try {
      const res = await fetch(API + '/api/files?kernelId=' + encodeURIComponent(kernelId));
      const data = await res.json();
      if (data.error) {
        setErr(data.error);
        setFiles([]);
      } else {
        setErr('');
        setFiles(data.files || []);
        setWorkspace(data.workspace || '');
      }
    } catch (e) {
      setErr(e.message);
    } finally {
      setLoading(false);
    }
  }, [kernelId]);

  // Initial load + auto-refresh whenever a run finishes (running map shrinks
  // back to empty). Files often only appear after Bash/Edit/Write tool calls,
  // so this saves the user from manually clicking refresh.
  useEffect(() => { refresh(); }, [refresh]);
  const runningCount = Object.keys(running).length;
  const prevRunning = useRef(0);
  useEffect(() => {
    if (prevRunning.current > 0 && runningCount === 0) refresh();
    prevRunning.current = runningCount;
  }, [runningCount, refresh]);

  const wsLabel = workspace ? workspace.split('/').slice(-2).join('/') : '(no workspace yet)';
  return (
    <aside className="file-sidebar">
      <div className="sb-header">
        <div style={{ flex: 1, minWidth: 0 }}>
          <div className="title">Files</div>
          <span className="ws-path" title={workspace}>{wsLabel}</span>
        </div>
        <button className="sb-refresh" onClick={refresh} disabled={loading} title="Refresh">
          {loading ? '…' : '↻'}
        </button>
      </div>
      <div className="sb-list">
        {err && <div className="sb-empty" style={{ color: 'var(--red)' }}>{err}</div>}
        {!err && files.length === 0 && (
          <div className="sb-empty">{loading ? 'Loading…' : 'Workspace is empty'}</div>
        )}
        {files.map((f) => {
          const depth = f.path.split('/').length - 1;
          return (
            <div key={f.path} className={`sb-item ${f.type}`}
                 style={{ paddingLeft: 12 + depth * 12 }}
                 title={f.path}>
              <span>{f.type === 'dir' ? '▸' : '·'}</span>
              <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>
                {f.path.split('/').pop()}
              </span>
              {f.type === 'file' && f.size != null && (
                <span className="size">{formatSize(f.size)}</span>
              )}
            </div>
          );
        })}
      </div>
    </aside>
  );
}

function formatSize(n) {
  if (n < 1024) return n + 'B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + 'K';
  return (n / 1024 / 1024).toFixed(1) + 'M';
}

function SessionWidget({ ctxPct, lastInputTokens, contextLimit, totalCost, cells }) {
  let included = 0, excluded = 0;
  for (const c of cells) {
    if (c.kind !== 'prompt' && c.kind !== 'python') continue;
    if (c.included === false) excluded++; else included++;
  }
  const ctxClass = ctxPct >= 90 ? 'danger' : ctxPct >= 70 ? 'warn' : '';
  return (
    <div className="session-widget">
      <div className="row ctx-row">
        <div className="ctx-top">
          <span className="label">Context</span>
          <span className="val" title={`${lastInputTokens.toLocaleString()} / ${contextLimit.toLocaleString()} tokens`}>
            {ctxPct}% · {formatTokens(lastInputTokens)} / {formatTokens(contextLimit)}
          </span>
        </div>
        <div className="ctx-bar"><div className={`ctx-bar-fill ${ctxClass}`} style={{ width: ctxPct + '%' }} /></div>
      </div>
      <div className="row">
        <span className="label">Turns</span>
        <span className="val">
          {included} included
          {excluded > 0 && <span className="excluded">· {excluded} excluded</span>}
        </span>
      </div>
      <div className="row">
        <span className="label">Cost</span>
        <span className="val cost">${totalCost.toFixed(4)}</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
